<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Promedio - Taller Integrador</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="cont1">
        <h1>Calculadora de Promedio</h1>
        <p>Ingrese las tres notas del corte para calcular el promedio ponderado.</p>

        <div class="input-group">
            <label for="n1">Nota 1:</label>
            <input type="number" id="n1" step="0.1" min="0" max="5">
        </div>

        <div class="input-group">
            <label for="n2">Nota 2:</label>
            <input type="number" id="n2" step="0.1" min="0" max="5">
        </div>

        <div class="input-group">
            <label for="n3">Nota 3:</label>
            <input type="number" id="n3" step="0.1" min="0" max="5">
        </div>

        <button onclick="calcularPromedio()">Calcular Promedio</button>

        <p id="r" class="result-text"></p>
        <p id="r2" class="result-text"></p>
    </main>

    <script>
        function calcularPromedio() {
            const n1 = parseFloat(document.getElementById("n1").value);
            const n2 = parseFloat(document.getElementById("n2").value);
            const n3 = parseFloat(document.getElementById("n3").value);

            const elementoResultado = document.getElementById("r");
            const elementoEstado = document.getElementById("r2");

            if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
                elementoResultado.textContent = "Por favor, ingrese todas las notas requeridas.";
                elementoEstado.textContent = "";
                return;
            }

            const promedio = (n1 + n2 + n3) / 3;

            elementoResultado.textContent = `Promedio: ${promedio.toFixed(2)}`;

            if (promedio >= 3.0) {
                elementoEstado.textContent = "Resultado: Aprobado";
                elementoEstado.style.color = "green";
            } else {
                elementoEstado.textContent = "Resultado: Reprobado";
                elementoEstado.style.color = "red";
            }
        }
    </script>

</body>
</html>
